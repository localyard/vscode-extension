# Publishes to the VS Code Marketplace when a v* tag is pushed. The tag must
# match "version" in package.json. Needs the VSCE_PAT secret (see PUBLISHING.md).
name: Release
run-name: ${{ github.ref_name }}

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Check the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match package.json version $version" >&2
            exit 1
          fi
      - run: npx vsce package --out localyard.vsix
      - run: npx vsce publish --packagePath localyard.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
      - name: Attach the .vsix to a GitHub release
        run: gh release create "$GITHUB_REF_NAME" localyard.vsix --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md."
        env:
          GH_TOKEN: ${{ github.token }}
